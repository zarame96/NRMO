name: NRMO Business package checks

on:
  push:
    branches: [codex/nrmo-business-rc1]
    paths:
      - 'skill/nrmo-business/**'
      - 'skill/business-release.json'
      - 'skill/tools/build_business_package.py'
      - '.github/workflows/skill-business-package.yml'
  pull_request:
    paths:
      - 'skill/nrmo-business/**'
      - 'skill/business-release.json'
      - 'skill/tools/build_business_package.py'
      - '.github/workflows/skill-business-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate and build deterministic Business package
        run: python3 skill/tools/build_business_package.py
      - name: Upload candidate package and manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nrmo-business-rc1-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/nrmo-business-rc1/
          if-no-files-found: error
          retention-days: 30
