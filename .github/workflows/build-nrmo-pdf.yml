name: Build NRMO v7.2 PDF

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/build-nrmo-pdf.yml
      - NRMOIntegrated/**/*.tex
      - NRMOIntegrated/references.bib
      - NRMOIntegrated/Makefile
      - NRMOIntegrated/NRMO_Complete_v5_5.pdf
      - NRMOIntegrated/NRMO_Integrated_System_v7_2.pdf
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-nrmo-pdf.yml
      - NRMOIntegrated/**/*.tex
      - NRMOIntegrated/references.bib
      - NRMOIntegrated/Makefile
      - NRMOIntegrated/NRMO_Complete_v5_5.pdf
      - NRMOIntegrated/NRMO_Integrated_System_v7_2.pdf

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Require PDF updates with publication source changes
        if: github.event_name != 'workflow_dispatch'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$PUSH_BASE_SHA"
          fi
          if [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
            echo "No comparable base SHA; skipping paired-file check."
            exit 0
          fi

          changed="$(git diff --name-only "$base_sha" "$GITHUB_SHA")"
          echo "$changed"
          if echo "$changed" | grep -Eq '^NRMOIntegrated/(.*\.tex|references\.bib|Makefile)$'; then
            for pdf in               NRMOIntegrated/NRMO_Complete_v5_5.pdf               NRMOIntegrated/NRMO_Integrated_System_v7_2.pdf; do
              if ! echo "$changed" | grep -Fxq "$pdf"; then
                echo "Publication source changed without updated $pdf" >&2
                exit 1
              fi
            done
          fi

      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             texlive-latex-base             texlive-latex-recommended             texlive-latex-extra             texlive-fonts-recommended             texlive-pictures             texlive-science             texlive-bibtex-extra             poppler-utils

      - name: Build publication PDFs from repository source
        working-directory: NRMOIntegrated
        run: |
          set -euo pipefail
          make clean
          make all
          test -s NRMO_Complete_v5_5.pdf
          cp -f NRMO_Complete_v5_5.pdf NRMO_Integrated_System_v7_2.pdf
          test -s NRMO_Integrated_System_v7_2.pdf
          cmp NRMO_Complete_v5_5.pdf NRMO_Integrated_System_v7_2.pdf
          pdfinfo NRMO_Integrated_System_v7_2.pdf | tee /tmp/nrmo-pdfinfo.txt
          sha256sum NRMO_Complete_v5_5.pdf NRMO_Integrated_System_v7_2.pdf             | tee /tmp/nrmo-pdf-sha256.txt

      - name: Build summary
        if: always()
        run: |
          {
            echo "## NRMO v7.2 PDF verification"
            echo
            if [ -f /tmp/nrmo-pdfinfo.txt ]; then
              echo '```text'
              cat /tmp/nrmo-pdfinfo.txt
              echo '```'
            fi
            if [ -f /tmp/nrmo-pdf-sha256.txt ]; then
              echo '```text'
              cat /tmp/nrmo-pdf-sha256.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
