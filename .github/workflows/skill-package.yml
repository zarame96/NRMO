name: Skill package checks

on:
  push:
    branches: [docs/ext-nonoverlap-v0.1]
    paths: ['skill/**', '.github/workflows/skill-package.yml']
  pull_request:
    paths: ['skill/**', '.github/workflows/skill-package.yml']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate references and round-trip the deterministic package
        run: python3 skill/tools/build_package.py
      - name: Upload candidate package and manifest (not a model-test result)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nrmo-rc5-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/nrmo-rc5/
          if-no-files-found: error
          retention-days: 30
